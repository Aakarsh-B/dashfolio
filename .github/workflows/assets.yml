# After every change to the content or code: refresh small covers, share cards, the resume PDF and the pages,
# and commit them if anything changed. Bot commits don't re-trigger this, so there's no loop.
name: Rebuild assets

on:
  push:
    branches: [main]
    paths: ['js/**', 'css/**', 'resume.html', 'index.html', 'images/projects/**', 'images/board/me.jpg', 'scripts/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: site-bot
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install Pillow and Playwright
        run: |
          pip install --quiet pillow
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: bash scripts/assets.sh
      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Everything up to date."; exit 0; fi
          git config user.name "dashfolio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Assets: refresh covers, share cards, resume PDF and pages"
          git pull --rebase
          git push
          curl -s -o /dev/null -w "Pages build request: %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
